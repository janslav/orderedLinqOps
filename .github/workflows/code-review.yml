name: Automated Code Review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  trigger-review:
    name: Trigger Copilot Code Review
    runs-on: ubuntu-latest
    
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post Review Request
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const message = `## 🤖 Automated Code Review Requested

            I'm analyzing this PR against our quality standards:
            - **Documentation**: XML docs, comments, clarity
            - **Correctness**: Ordering validation, streaming behavior, memory efficiency
            - **Compatibility**: Multi-target (.NET Standard, .NET 6/8), backward compatibility
            - **Performance**: Algorithm complexity, allocations, large dataset handling
            - **Testing**: Coverage, edge cases, framework compatibility
            - **Patterns**: OrderedLinqOps conventions and style

            Check back in a moment for detailed findings based on [CODE_REVIEW_CHECKLIST.md](https://github.com/janslav/orderedLinqOps/blob/master/CODE_REVIEW_CHECKLIST.md).

            ---
            See [.copilot-instructions.md](https://github.com/janslav/orderedLinqOps/blob/master/.copilot-instructions.md) for review guidance.`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
