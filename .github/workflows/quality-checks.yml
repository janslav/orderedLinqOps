name: Quality Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  mechanical-checks:
    name: Mechanical Quality Checks
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check XML Documentation
        id: xml-docs
        run: |
          set +e
          # Build only the main library with XML doc validation
          output=$(dotnet build src/OrderedLinqOps/OrderedLinqOps.csproj -p:TreatWarningsAsErrors=true 2>&1)
          xml_issues=$(echo "$output" | grep -E "CS1591|XML documentation" || true)
          
          if [ -z "$xml_issues" ]; then
            echo "XML documentation check: PASSED ✓"
            echo "xml_docs_ok=true" >> $GITHUB_OUTPUT
          else
            echo "XML documentation check: FAILED ✗"
            echo "xml_docs_output<<EOF" >> $GITHUB_OUTPUT
            echo "$xml_issues" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "xml_docs_ok=false" >> $GITHUB_OUTPUT
          fi
          set -e

      - name: Check source changes
        id: src-files
        run: |
          changed_files=$(git diff origin/master...HEAD --name-only)
          src_changed=$(printf '%s\n' "$changed_files" | grep -E "^src/" || true)
          ordered_ops_changed=$(printf '%s\n' "$changed_files" | grep -E "^src/OrderedLinqOps/Ordered(GroupBy|Join|GroupJoin)\.cs$" || true)
          if [ -z "$src_changed" ]; then
            echo "src_changed=false" >> $GITHUB_OUTPUT
          else
            echo "src_changed=true" >> $GITHUB_OUTPUT
          fi
          if [ -z "$ordered_ops_changed" ]; then
            echo "ordered_ops_changed=false" >> $GITHUB_OUTPUT
          else
            echo "ordered_ops_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Check CHANGELOG.md updated
        id: changelog
        run: |
          set -e
          changed_files=$(git diff origin/master...HEAD --name-only)
          code_changed=$(printf '%s\n' "$changed_files" | grep -E "^src/" || true)
          changelog_changed=$(printf '%s\n' "$changed_files" | grep -E "^CHANGELOG.md$" || true)

          if [ -z "$code_changed" ]; then
            echo "changelog_ok=true" >> $GITHUB_OUTPUT
            echo "changelog_missing=false" >> $GITHUB_OUTPUT
            echo "CHANGELOG check: SKIPPED (no src/ changes)"
            exit 0
          fi

          if [ -z "$changelog_changed" ]; then
            echo "changelog_ok=false" >> $GITHUB_OUTPUT
            echo "changelog_missing=true" >> $GITHUB_OUTPUT
            echo "CHANGELOG check: FAILED (src/ changed but CHANGELOG.md was not updated)"
            echo "Please add a brief entry under the 'Unreleased' section in CHANGELOG.md for the user-visible or contributor-facing change."
            exit 0
          fi

          echo "changelog_ok=true" >> $GITHUB_OUTPUT
          echo "changelog_missing=false" >> $GITHUB_OUTPUT
          echo "CHANGELOG check: PASSED"

      - name: Report mechanical status
        id: status
        run: |
          echo "Mechanical checks do not run the full test suite; CI handles the build/test job separately."
          echo "This workflow is limited to documentation, changelog, and repo-quality checks."
          echo "status_report=ok" >> "$GITHUB_OUTPUT"
          echo "## Mechanical status" >> "$GITHUB_STEP_SUMMARY"
          echo "- XML documentation: checked" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changelog: checked when src/ changes" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI test execution: delegated to the separate CI workflow" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for test changes
        id: test-files
        run: |
          changed_files=$(git diff origin/master...HEAD --name-only)
          test_changed=$(printf '%s\n' "$changed_files" | grep -E "(^|/)Test.*\.cs$|(^|/).*Tests?\.cs$" || true)
          if [ -z "$test_changed" ]; then
            echo "tests_changed=false" >> $GITHUB_OUTPUT
          else
            echo "tests_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Compare Ordered benchmark regression vs master
        id: ordered-bench
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "benchmark_checked=false" >> "$GITHUB_OUTPUT"
            echo "benchmark_passed=true" >> "$GITHUB_OUTPUT"
            echo "benchmark_summary=Skipped: not a pull request event." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.src-files.outputs.ordered_ops_changed }}" != "true" ]; then
            echo "benchmark_checked=false" >> "$GITHUB_OUTPUT"
            echo "benchmark_passed=true" >> "$GITHUB_OUTPUT"
            echo "benchmark_summary=Skipped: Ordered operator implementation files did not change." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "benchmark_checked=true" >> "$GITHUB_OUTPUT"

          git fetch origin master --depth=1
          rm -rf /tmp/orderedlinqops-master
          git worktree add /tmp/orderedlinqops-master origin/master

          rm -rf BenchmarkDotNet.Artifacts
          dotnet run -c Release --project src/OrderedLinqOps.Benchmarks/OrderedLinqOps.Benchmarks.csproj -- --filter "*OrderedGroupBy*" "*OrderedJoin*" "*OrderedGroupJoin*"
          cp BenchmarkDotNet.Artifacts/results/OrderedOperatorsBenchmarks-report.csv /tmp/pr-ordered-bench.csv

          rm -rf /tmp/orderedlinqops-master/BenchmarkDotNet.Artifacts
          (
            cd /tmp/orderedlinqops-master
            dotnet run -c Release --project src/OrderedLinqOps.Benchmarks/OrderedLinqOps.Benchmarks.csproj -- --filter "*OrderedGroupBy*" "*OrderedJoin*" "*OrderedGroupJoin*"
            cp BenchmarkDotNet.Artifacts/results/OrderedOperatorsBenchmarks-report.csv /tmp/master-ordered-bench.csv
          )

          set +e
          python3 .github/scripts/compare_ordered_benchmarks.py \
            /tmp/master-ordered-bench.csv \
            /tmp/pr-ordered-bench.csv \
            10 \
            10 \
            /tmp/ordered-bench-summary.md
          compare_exit=$?
          set -e

          if [ "$compare_exit" -eq 0 ]; then
            echo "benchmark_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "benchmark_passed=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "benchmark_summary<<EOF"
            cat /tmp/ordered-bench-summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cat /tmp/ordered-bench-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report Results
        uses: actions/github-script@v7
        with:
          script: |
            const xmlDocsOk = '${{ steps.xml-docs.outputs.xml_docs_ok }}' === 'true';
            const changelogOk = '${{ steps.changelog.outputs.changelog_ok }}' === 'true';
            const changelogMissing = '${{ steps.changelog.outputs.changelog_missing }}' === 'true';
            const srcChanged = '${{ steps.src-files.outputs.src_changed }}' === 'true';
            const testsChanged = '${{ steps.test-files.outputs.tests_changed }}' === 'true';
            const benchmarkChecked = '${{ steps.ordered-bench.outputs.benchmark_checked }}' === 'true';
            const benchmarkPassed = '${{ steps.ordered-bench.outputs.benchmark_passed }}' === 'true';
            const benchmarkSummary = `${{ steps.ordered-bench.outputs.benchmark_summary }}`.trim();
            const xmlDocsOutput = `${{ steps.xml-docs.outputs.xml_docs_output }}`.trim();
            
            let report = '## 🤖 Mechanical Quality Checks\n\n';
            
            // XML Documentation check
            if (xmlDocsOk) {
              report += '✅ **XML Documentation**: All public APIs properly documented\n';
            } else {
              report += '❌ **XML Documentation**: Missing or incomplete\n';
              if (xmlDocsOutput) {
                report += '```\n' + xmlDocsOutput + '\n```\n';
                report += 'Add `<summary>`, `<param>`, `<returns>`, and `<exception>` tags to all public APIs.\n';
              }
            }
            
            // CHANGELOG check
            if (changelogMissing) {
              report += '⚠️  **CHANGELOG**: Not updated (code was changed)\n';
              report += 'Add an entry to CHANGELOG.md under "Unreleased" section.\n';
              report += 'Format: `- **Category**: Brief description` where Category is Added, Changed, Fixed, etc.\n';
            } else if (changelogOk) {
              report += '✅ **CHANGELOG**: Updated\n';
            }
            
            // Tests check (delegated to CI)
            if (testsChanged && !srcChanged) {
              report += '⚠️  **Tests**: Test-only change detected. The full test suite is still run by the separate CI workflow.\n';
            } else if (srcChanged) {
              report += 'ℹ️  **Tests**: Source code changed; the full CI test suite remains the authoritative validation path for this repository.\n';
            } else {
              report += '✅ **Tests**: Not rerun here; CI handles the full test suite separately.\n';
            }

            if (!benchmarkChecked) {
              report += 'ℹ️  **Ordered benchmark regression**: ' + benchmarkSummary + '\n';
            } else if (benchmarkPassed) {
              report += '✅ **Ordered benchmark regression**: Passed against master baseline\n';
            } else {
              report += '❌ **Ordered benchmark regression**: Failed threshold check vs master baseline\n';
            }
            
            // Summary
            report += '\n';
            if (xmlDocsOk && (!benchmarkChecked || benchmarkPassed)) {
              report += '### ✅ All required mechanical checks passed!\n';
              report += 'The CI workflow remains responsible for running the library test suite and reporting runtime results.\n';
            } else {
              report += '### ❌ Some checks failed\n';
              report += 'Please address the issues above and push new commits to update this PR.\n';
            }

            console.log(report);
            await core.summary.addRaw(report).write();
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
            
            // Add labels based on failures
            const labels = [];
            if (!xmlDocsOk) labels.push('docs-missing');
            if (changelogMissing) labels.push('changelog-missing');
            
            if (labels.length > 0) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            }
            
            // Fail job if critical checks failed; changelog is informational only.
            if (!xmlDocsOk || (benchmarkChecked && !benchmarkPassed)) {
              core.setFailed('Mechanical quality checks failed. Please address issues above.');
            }
